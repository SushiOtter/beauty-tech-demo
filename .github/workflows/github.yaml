name: Deploy to GitHub Pages

on:
  push:
    branches: ["main"] # O la rama principal que uses (ej. master)

# Cancela despliegues anteriores en curso para evitar el conflicto
concurrency:
  group: "pages"
  cancel-in-progress: true

# Opciones de permisos necesarias para GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Prepare site
        run: |
          mkdir _site
          cp index.html _site/
          cp -r assets css data js models vendor _site/

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          name: github-pages
          path: _site

      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v5
        with:
          artifact_name: github-pages